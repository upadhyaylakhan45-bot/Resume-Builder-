{% extends "base.html" %}
{% block title %}Preview — {{ resume.title }}{% endblock %}

{% block content %}
<section class="page-shell">
  <div class="container">
    <div class="preview-toolbar">
      <div>
        <h1 style="font-family:var(--font-display);margin:0;font-size:1.75rem">{{ resume.title }}</h1>
        <p style="margin:0.25rem 0 0;color:var(--muted);font-size:0.9rem">
          {{ resume.template|capitalize }} · {{ resume.font_family }} · {{ resume.accent_color }}
        </p>
      </div>
      <div class="resume-actions">
        <a class="btn btn-ghost btn-sm" href="{{ url_for('resume.edit_meta', resume_id=resume.id) }}">Style</a>
        <a class="btn btn-ghost btn-sm" href="{{ url_for('resume.edit_personal', resume_id=resume.id) }}">Edit details</a>
        <a class="btn btn-accent btn-sm" href="{{ url_for('resume.download_pdf', resume_id=resume.id) }}">Download PDF</a>
      </div>
    </div>
    <div class="preview-frame">
      {{ resume_html|safe }}
    </div>
  </div>
</section>
{% endblock %}
